name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/validate_skills.py
      - run: python scripts/install_skill.py super-review --host claude --skills-directory "$RUNNER_TEMP/.claude/skills" --claude-agents-directory "$RUNNER_TEMP/.claude/agents/coding-agent-skills"
      - run: python scripts/install_skill.py pr-review --host claude --skills-directory "$RUNNER_TEMP/.claude/skills" --claude-agents-directory "$RUNNER_TEMP/.claude/agents/coding-agent-skills"
      - run: python scripts/install_skill.py smoke-test --host claude --skills-directory "$RUNNER_TEMP/.claude/skills" --claude-agents-directory "$RUNNER_TEMP/.claude/agents/coding-agent-skills"
