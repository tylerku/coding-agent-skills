version: 1

metadata:
  verified_on: "2026-10-04"
  sources:
    openai: https://developers.openai.com/api/docs/guides/latest-model
    anthropic: https://platform.claude.com/docs/en/models/overview
    anthropic_pricing: https://platform.claude.com/docs/en/about-claude/pricing
    xai: https://docs.x.ai/developers/model-capabilities/text/reasoning

providers:
  openai:
    preferred_runner: codex
    capability_tiers:
      routine:
        model: gpt-5.6-luna
      advanced:
        model: gpt-6.1-sol
      frontier:
        model: gpt-6.1-sol
    reasoning_effort_map:
      low: low
      medium: medium
      high: high
      maximum: max

  anthropic:
    preferred_runner: claude_code
    capability_tiers:
      routine:
        model: claude-sonnet-5-5
      advanced:
        model: claude-sonnet-5-5
      frontier:
        model: claude-opus-5-5
        alternatives:
          - claude-opus-5
    blocked_models:
      - claude-fable-5
    reasoning_effort_ceiling: high
    reasoning_effort_map:
      low: low
      medium: medium
      high: high
      maximum: high
    notes:
      - User preference caps all Anthropic review work at high effort, including critical adjudication and the Maximum profile.
      - Apply the effort ceiling before selecting an agent; maximum requirements resolve to high under this explicit user override.
      - Fable is disabled for initial selection, project overrides, fallbacks, and host substitutions.
      - Use Opus 5.5 for critical adjudication; Opus 5 remains the configured frontier alternative.
      - Routine and advanced roles both resolve to Sonnet 5.5.
      - Record the requested effort, effective high-effort ceiling, and actual model in the reviewer receipt.

  xai:
    preferred_runner: grok_build
    capability_tiers:
      routine:
        model: grok-4.6
      advanced:
        model: grok-4.6
      frontier:
        model: grok-4.6
    reasoning_effort_map:
      low: low
      medium: medium
      high: high
      maximum: xhigh
    optional_execution_modes:
      multi_agent:
        model: grok-4.20-multi-agent
        semantics: reasoning_effort_controls_agent_count
    notes:
      - Do not use the multi-agent effort setting as a reasoning-depth substitute.

runners:
  codex:
    provider: openai
  claude_code:
    provider: anthropic
  grok_build:
    provider: xai
  pi:
    provider: configurable
    requirement: Resolve its concrete provider model through project or user configuration before use.

fallback_policy:
  allow_same_or_higher_capability: true
  allow_lower_capability: false
  require_disclosure: true
  respect_user_cost_ceiling: true
